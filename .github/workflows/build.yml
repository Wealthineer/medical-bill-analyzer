name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest --tb=short

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: medical-bill-analyzer
            asset_name: medical-bill-analyzer-linux-amd64
          - os: macos-latest
            artifact_name: medical-bill-analyzer
            asset_name: medical-bill-analyzer-macos-amd64
          - os: windows-latest
            artifact_name: medical-bill-analyzer.exe
            asset_name: medical-bill-analyzer-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build executable
        run: uv run pyinstaller packaging/medical-bill-analyzer.spec

      - name: Test executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/${{ matrix.artifact_name }}
          dist/${{ matrix.artifact_name }} --version || true

      - name: Test executable (Windows)
        if: runner.os == 'Windows'
        run: dist/${{ matrix.artifact_name }} --version || true
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Linux
          cp artifacts/medical-bill-analyzer-linux-amd64/medical-bill-analyzer release/medical-bill-analyzer-linux-amd64
          chmod +x release/medical-bill-analyzer-linux-amd64
          tar -czvf release/medical-bill-analyzer-linux-amd64.tar.gz -C release medical-bill-analyzer-linux-amd64
          # macOS
          cp artifacts/medical-bill-analyzer-macos-amd64/medical-bill-analyzer release/medical-bill-analyzer-macos-amd64
          chmod +x release/medical-bill-analyzer-macos-amd64
          tar -czvf release/medical-bill-analyzer-macos-amd64.tar.gz -C release medical-bill-analyzer-macos-amd64
          # Windows
          cp artifacts/medical-bill-analyzer-windows-amd64.exe/medical-bill-analyzer.exe release/medical-bill-analyzer-windows-amd64.exe
          zip -j release/medical-bill-analyzer-windows-amd64.zip release/medical-bill-analyzer-windows-amd64.exe

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Medical Bill Analyzer ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            release/medical-bill-analyzer-linux-amd64.tar.gz
            release/medical-bill-analyzer-macos-amd64.tar.gz
            release/medical-bill-analyzer-windows-amd64.zip
          body: |
            ## Medical Bill Analyzer ${{ steps.get_version.outputs.VERSION }}

            ### Downloads

            | Platform | Download |
            |----------|----------|
            | Linux (x64) | `medical-bill-analyzer-linux-amd64.tar.gz` |
            | macOS (x64) | `medical-bill-analyzer-macos-amd64.tar.gz` |
            | Windows (x64) | `medical-bill-analyzer-windows-amd64.zip` |

            ### Installation

            **Linux/macOS:**
            ```bash
            tar -xzvf medical-bill-analyzer-<platform>-amd64.tar.gz
            chmod +x medical-bill-analyzer-<platform>-amd64
            ./medical-bill-analyzer-<platform>-amd64
            ```

            **Windows:**
            Extract the zip file and run `medical-bill-analyzer-windows-amd64.exe`

            ### First Run

            On first run, the application will automatically open the Settings screen to configure your LLM provider.
